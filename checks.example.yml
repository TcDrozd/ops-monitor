defaults:
  interval_s: 30
  timeout_s: 3
  retries: 1

checks:
  - id: ollama
    type: http
    url: "http://127.0.0.1:11434/api/tags"
    timeout_s: 5
    down_threshold: 2
    tags: [ai, api]

  - id: open-webui
    type: tcp
    host: "127.0.0.1"
    port: 3000
    down_threshold: 2
    tags: [ai, ui]

  - id: frigate
    type: frigate
    base_url: "http://192.168.50.201:5010"
    min_recording_storage_mb: 1500000
    max_recording_age_s: 120
    startup_grace_s: 120
    required_cameras:
      - FrontNorth
      - DogwoodCorner
      - FrontWalkway
      - Backyard
      - Driveway
      - FrontYard
      - SideYard
    down_threshold: 2
    tags: [camera, storage]
